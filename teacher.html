<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة المدرب — فيزياء 101</title>
<meta name="theme-color" content="#0369A1">
<meta name="robots" content="noindex">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="فيزياء 101">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F6F8;--panel:#FFFFFF;--ink:#172033;--muted:#5B6479;--line:#DDE2EA;--soft:#EEF2F6;--accent:#0369A1;--accent-soft:#E0F2FE;--accent-ink:#fff;--good:#1E7A3C;--mid:#A86A00;--bad:#B42330;--warnc:#C4542B;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#11151D;--panel:#181D27;--ink:#E7EAF0;--muted:#9AA3B5;--line:#2A3140;--soft:#222935;--accent:#38BDF8;--accent-soft:#0C2A3D;--accent-ink:#04121C;--good:#5FCB85;--mid:#E5B454;--bad:#F2737E;--warnc:#F08A62;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#11151D;--panel:#181D27;--ink:#E7EAF0;--muted:#9AA3B5;--line:#2A3140;--soft:#222935;--accent:#38BDF8;--accent-soft:#0C2A3D;--accent-ink:#04121C;--good:#5FCB85;--mid:#E5B454;--bad:#F2737E;--warnc:#F08A62;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;font-size:15.5px;line-height:1.6}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header b{font-size:18px}
header .sp{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:7px 14px;font-weight:600;font-size:14.5px;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:4px 10px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}
nav.tabs{display:flex;gap:2px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);padding:0 10px;scrollbar-width:none;position:sticky;top:var(--hh,57px);z-index:4}
nav.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 6px;font-size:17px}
.sub{color:var(--muted);font-size:14px;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=password],input[type=search],select{border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--paper);min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{color:var(--muted);display:block;font-size:13px}
.stat b{font-size:24px;font-variant-numeric:tabular-nums}
.tableWrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--soft);font-weight:600;position:sticky;top:0;cursor:pointer;user-select:none}
th.sorted::after{content:" ▾"}th.sorted.asc::after{content:" ▴"}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--accent-soft)}
td.num{font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.pct{display:inline-block;min-width:46px;text-align:center;border-radius:6px;padding:1px 6px;font-weight:600;font-variant-numeric:tabular-nums}
.pct.g{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pct.m{background:color-mix(in srgb,var(--mid) 18%,transparent);color:var(--mid)}
.pct.b{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pct.n{color:var(--muted)}
.tag{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--soft);color:var(--muted)}
.tag.warn{background:color-mix(in srgb,var(--mid) 18%,transparent);color:var(--mid)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr 52px;gap:8px;align-items:center;font-size:13.5px}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .trk{height:14px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar .fil{height:100%;border-radius:4px;background:var(--accent)}
.bar .fil.g{background:var(--good)}.bar .fil.m{background:var(--mid)}.bar .fil.b{background:var(--bad)}
.bar .val{font-variant-numeric:tabular-nums;text-align:left;direction:ltr}
.days{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--line);padding-top:6px}
.days div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px;position:relative}
.days div:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:12px;padding:2px 6px;border-radius:4px;white-space:nowrap}
.dayAxis{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.qrow{border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}
.qrow small{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.msg{font-size:14px;margin:8px 0 0}.msg.bad{color:var(--bad)}.msg.good{color:var(--good)}
/* login */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth form{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:380px;display:grid;gap:12px}
.auth h1{margin:0;font-size:21px;text-align:center}
.auth label{display:grid;gap:4px;font-weight:600;font-size:14px}
.auth input{font-size:17px;padding:10px;text-align:center;direction:ltr}
/* drawer */
.drawer{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;justify-content:flex-start}
.drawer>div{background:var(--paper);width:min(720px,100%);height:100%;overflow:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.dhead{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.dhead h2{margin:0;font-size:20px}
.dhead .x{margin-inline-start:auto}
.unitGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.unitGrid div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.unitGrid b{display:block;font-size:13.5px}
details.res{border-bottom:1px solid var(--line);padding:8px 0}
details.res summary{cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.res .when{color:var(--muted);font-size:12.5px;margin-inline-start:auto}
.det{font-size:13.5px;margin:6px 0 0;padding-inline-start:16px}
.det li{margin:2px 0}.det .ok{color:var(--good)}.det .no{color:var(--bad)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.credit{text-align:center;font-size:13px;color:var(--muted);padding:14px 10px 6px;line-height:1.6}
.credit b{color:var(--accent);font-weight:600}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:90vw}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}

/* ===== التقارير (إنفوجرافيك) ===== */
.rp-hero{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#0B1E3A));color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:14px;position:relative;overflow:hidden}
.rp-hero::after{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:#ffffff14}
.rp-hero small{opacity:.85;display:block}.rp-hero h2{margin:2px 0 4px;font-size:22px}.rp-hero .meta{font-size:13.5px;opacity:.9}
.rp-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.rp-kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.rp-kpi .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--accent-soft);flex:none}
.rp-kpi small{color:var(--muted);font-size:12.5px;display:block;line-height:1.4}.rp-kpi b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.rp-kpi em{font-style:normal;font-size:12px;color:var(--muted);display:block}
.rp-ring{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.rp-ring svg{flex:none}.rp-ring .t{font-size:13.5px;color:var(--muted)}
.rp-funnel{display:grid;gap:8px}
.rp-step{display:grid;grid-template-columns:minmax(88px,170px) 1fr 66px;gap:10px;align-items:center;font-size:14px}
.rp-step .trk{height:22px;background:var(--soft);border-radius:6px;overflow:hidden}
.rp-step .fil{height:100%;border-radius:6px;background:var(--accent);opacity:var(--o,1)}
.rp-step .v{font-variant-numeric:tabular-nums;direction:ltr;text-align:left;font-weight:600}
.rp-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.rp-tile{border:1px solid var(--line);border-radius:10px;padding:7px 8px;font-size:12.5px;line-height:1.35;background:var(--panel);cursor:pointer;text-align:start;min-height:70px;display:flex;flex-direction:column;justify-content:space-between}
.rp-tile:hover{border-color:var(--accent)}
.rp-tile b{font-size:16px;font-variant-numeric:tabular-nums}
.rp-tile.g{background:color-mix(in srgb,var(--good) 14%,var(--panel))}.rp-tile.m{background:color-mix(in srgb,var(--mid) 16%,var(--panel))}.rp-tile.b{background:color-mix(in srgb,var(--bad) 13%,var(--panel))}.rp-tile.n{color:var(--muted)}
.rp-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:8px 0 0}
.rp-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-inline-end:4px;border:1px solid var(--line)}
.rp-cmp{display:flex;align-items:flex-end;gap:18px;height:150px;padding:0 10px;border-bottom:1px solid var(--line)}
.rp-cmp div{flex:1;max-width:90px;border-radius:6px 6px 0 0;background:var(--accent);position:relative;min-height:2px}
.rp-cmp div.f{opacity:.45}
.rp-cmp span{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;margin-bottom:2px}
.rp-cmpx{display:flex;gap:18px;padding:4px 10px 0;font-size:12.5px;color:var(--muted)}.rp-cmpx span{flex:1;max-width:90px;text-align:center}
.rp-badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
.rp-q{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.rp-q .trk{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:4px 0}.rp-q .fil{height:100%;border-radius:4px}
.rp-note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.rp-note li{margin:3px 0}
.rp-off{display:none}
.rp-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.rp-form label{display:grid;gap:3px;font-size:13px;color:var(--muted)}
.rp-form input,.rp-form select,.rp-form textarea{border:1.5px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--paper);font:inherit;color:inherit;min-width:0}
.rp-sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px;font-size:14px}.rp-sign div{border-top:1px dashed var(--muted);padding-top:6px;text-align:center}
@media print{.rp-off{display:block}.rp-edit{display:none!important}}
@media print{header,nav.tabs,.rp-ctl,.toast{display:none!important}body{background:#fff}main{max-width:none;padding:0}.card,.rp-kpi,.rp-hero{break-inside:avoid}.tableWrap{overflow:visible;max-height:none!important}.rp-hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}.rp-tile,.rp-step .fil,.rp-cmp div,.pct{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media (max-width:640px){main{padding:10px}header b{font-size:16px}.stat b{font-size:20px}}
.exGrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.exT{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel)}.exT.on{border:2px solid var(--good)}
.exTh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:16px}.exSt{font-size:13.5px;margin:6px 0 10px}
.exZ{color:var(--bad);font-weight:800}.exRaw{color:var(--muted);font-weight:400}
.exWin{margin:10px 0;border:1px dashed var(--line);border-radius:12px;padding:8px 10px}.exWin summary{cursor:pointer}.exWR{display:grid;gap:6px;padding:8px 0;border-top:1px solid var(--line);margin-top:6px}.exWR label{display:flex;gap:8px;align-items:center;justify-content:space-between}.exWR input{flex:1;max-width:220px}.exWNow{font-size:13px;opacity:.85}
.bkG{border-bottom:1px solid var(--line);padding:8px 0}.bkG summary{cursor:pointer;line-height:1.8}.bkQ{padding:8px 4px;border-top:1px dashed var(--line)}.bkN{font-weight:600;line-height:1.8}.bkB{font-size:13px;opacity:.8;margin-bottom:4px}.bkO{margin:4px 18px 0 0;padding:0;line-height:1.8}.bkO li{list-style:none}.bkO li.ok{color:var(--good,#15803D);font-weight:700}.bkM{unicode-bidi:isolate}
.exCode{margin:6px 0;padding:8px 10px;border:2px dashed var(--accent,#0b6aa2);border-radius:10px;font-size:15px}.exCode b.exCT{font-size:15px;letter-spacing:0}.exCR{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line,#e5e7eb)}.exCR span{flex:1}.exCR b{font-size:20px;letter-spacing:4px}.exCode small{opacity:.8}
.exStats{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:6px 0 12px}.exStat{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:13.5px;background:var(--panel)}.exStat b{font-size:14.5px;color:var(--accent)}
.exSecs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.exSec{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--panel)}
.exMin{display:flex;align-items:center;gap:6px;font-size:14px}.exMin input{width:64px}.exc{cursor:pointer}.exc:hover{background:var(--accent-soft,#eef)}
.ppD .ppH{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--accent);margin:14px 0 6px;padding-bottom:4px}.ppSc{font-weight:800;color:var(--good);border:1.5px solid var(--good);border-radius:8px;padding:0 10px}.ppSc.wip{color:var(--mid);border-color:var(--mid)}
.ppQ{border:1px solid var(--line);border-radius:8px;padding:5px 8px;margin:5px 0;font-size:14px;break-inside:avoid}.ppOs{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:3px}.ppO{border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:13.5px}
.ppO.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent);font-weight:700}.ppO.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent);text-decoration:line-through}.ppD .ok{color:var(--good);font-weight:800}.ppD .bad{color:var(--bad);font-weight:800}
.ppM{unicode-bidi:isolate;font-family:ui-monospace,Consolas,monospace}.ppD h4{margin:8px 0 2px;color:var(--accent)}.ppTitle{margin:6px 0}
@media print{body.ppPrinting>*:not(.ppD){display:none!important}body.ppPrinting .ppD{position:static;background:#fff;display:block}body.ppPrinting .ppD>div{width:100%;height:auto;overflow:visible;padding:0;background:#fff;color:#000}body.ppPrinting .ppCtl{display:none!important}body.ppPrinting .ppS{break-before:page}body.ppPrinting .ppS:first-of-type{break-before:auto}}
.exCRn{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.exAb{color:var(--bad,#b91c1c)!important}.exTm{display:block;font-size:11px;color:var(--muted);font-weight:400;line-height:1.5;white-space:nowrap;margin-top:2px}
</style>

<body>
<div id="root"></div>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="excel.js"></script>
<script>
const API=(window.P101_API||'').trim();
const UNITS=window.UNITS||[];
const ORD=['الأولى','الثانية','الثالثة','الرابعة','الخامسة'];
const LESSONS=[];UNITS.forEach((u,ui)=>u.l.forEach((l,li)=>{if(!l.hide)LESSONS.push({k:ui+'-'+li,u:ui,raw:l.t,t:l.pre?l.pre+'، و'+l.t:l.t})}));
const LT=Object.fromEntries(LESSONS.map(x=>[x.k,x.t]));
const TOTAL=LESSONS.length;
const NONLES=/^مقدمة الوحدة|ورقة عمل|مراجعة وتمارين/,TEACH=LESSONS.filter(l=>!NONLES.test(l.raw||l.t)),TEACH_N=TEACH.length,N_INTRO=LESSONS.filter(l=>/^مقدمة الوحدة/.test(l.raw||l.t)).length,N_WS=LESSONS.filter(l=>/ورقة عمل/.test(l.t)).length,N_REV=LESSONS.filter(l=>/مراجعة وتمارين/.test(l.t)).length;
const LES_NOTE=()=>(N_INTRO?AR(N_INTRO)+' مقدمات · ':'')+AR(N_WS)+' أوراق عمل محلولة · '+AR(N_REV)+' مراجعات';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const AR=n=>String(n);   // الأرقام بالإنجليزية في كل المنصة
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

async function addStudent(){

/* الطباعة لا تعمل داخل تطبيق الشاشة الرئيسية في الآيفون؛ نوجّه المدرب إلى Safari */
function printReport(){

  const url=location.origin+location.pathname;
  const d=document.createElement('div');d.className='drawer';
  d.innerHTML=`<div role="dialog" aria-label="حفظ التقرير PDF" style="max-width:460px;margin:auto;align-self:center"><div class="dhead"><div><h2>📄 حفظ التقرير PDF</h2></div><button class="x" aria-label="إغلاق">✕</button></div>
  <div style="padding:14px 16px;line-height:1.9"><p>الطباعة وحفظ PDF لا يعملان داخل أيقونة المنصة على الشاشة الرئيسية. افتح لوحة المدرب في <b>Safari</b>:</p>
  <ol style="padding-inline-start:1.3em;margin:6px 0"><li>انسخ الرابط بالزر أدناه.</li><li>افتح Safari والصق الرابط، ثم سجّل الدخول.</li><li>افتح التقارير واضغط «طباعة / PDF»، ثم اختر <b>حفظ في الملفات</b> أو شارك الملف.</li></ol>
  <div class="row" style="margin-top:10px"><input readonly value="${url}" style="flex:1;direction:ltr" id="prU"><button class="btn sm" id="prC">نسخ الرابط</button></div></div></div>`;
  document.body.appendChild(d);const close=()=>d.remove();d.onclick=e=>{if(e.target===d)close()};d.querySelector('.x').onclick=close;
  d.querySelector('#prC').onclick=async()=>{const i=d.querySelector('#prU');try{await navigator.clipboard.writeText(url);toast('تم نسخ الرابط')}catch(e){i.select();document.execCommand('copy');toast('تم نسخ الرابط')}};
}
function saveBook(sheets,name){try{EXCEL.write(sheets,name);toast('تم إنشاء الملف: '+name)}catch(e){toast('تعذّر إنشاء ملف Excel.')}return Promise.resolve()}
const HEAD={id:['الرقم التدريبي','الرقم','رقم المتدرب','رقم','id','ID','student id','StudentID','الرقم الأكاديمي','رقم الهوية'],name:['الاسم','اسم المتدرب','الاسم الكامل','name','Name','student name'],section:['الشعبة','الشعبه','رقم الشعبة','section','Section','class','المجموعة']};
const norm=s=>String(s||'').trim().toLowerCase().replace(/[ـ]/g,'');

async function readFile(f){
  const p=$('#prev');p.innerHTML='<p class="empty"><span class="spin"></span> جارٍ قراءة الملف…</p>';
  let rows;
  try{rows=await EXCEL.read(f)}catch(e){p.innerHTML=`<p class="empty">${e.message==='old_xls'?'هذا ملف Excel قديم (.xls). افتحه واحفظه بصيغة .xlsx ثم أعد المحاولة.':e.message==='no_inflate'?'متصفحك قديم ولا يدعم قراءة ملفات Excel. حدّث النظام أو احفظ الملف بصيغة CSV.':'تعذّرت قراءة الملف. تأكد أنه ملف Excel (.xlsx) أو CSV.'}</p>`;return}
  rows=rows.map(r=>(r||[]).map(c=>c==null?'':c));
  rows=rows.filter(r=>r.some(c=>String(c).trim()));
  if(!rows.length){p.innerHTML='<p class="empty">الملف فارغ.</p>';return}
  let hi=rows.findIndex(r=>r.some(c=>HEAD.id.map(norm).includes(norm(c))||HEAD.name.map(norm).includes(norm(c))));
  let ci={id:0,name:1,section:2};
  if(hi>=0){const h=rows[hi].map(norm);ci={id:h.findIndex(c=>HEAD.id.map(norm).includes(c)),name:h.findIndex(c=>HEAD.name.map(norm).includes(c)),section:h.findIndex(c=>HEAD.section.map(norm).includes(c))};rows=rows.slice(hi+1)}
  if(ci.id<0||ci.name<0){p.innerHTML='<div class="card"><p class="msg bad">لم أجد عمودي «الرقم التدريبي» و«الاسم» في الملف. استخدم النموذج.</p></div>';return}
  const def=$('#defSec').value;
  const data=rows.map(r=>({id:String(r[ci.id]||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim(),name:String(r[ci.name]||'').trim(),section:ci.section>=0?String(r[ci.section]||'').trim()||def:def}));
  const good=data.filter(x=>x.id&&x.name),bad=data.length-good.length;
  const ids=new Set(DATA.students.map(s=>s.id));const nw=good.filter(x=>!ids.has(x.id)).length;
  const secs=[...new Set(good.map(x=>x.section).filter(Boolean))];const newSecs=secs.filter(s=>!DATA.sections.some(x=>x.name===s));
  p.innerHTML=`<div class="card"><h2>3. راجع ثم ارفع</h2><p class="sub">${AR(good.length)} متدربًا صالحًا (${AR(nw)} جديد، ${AR(good.length-nw)} موجود وسيُحدَّث)${bad?` · ${AR(bad)} صفًا ناقصًا سيُتجاهل`:''}${newSecs.length?` · شعب جديدة ستُنشأ: ${newSecs.map(esc).join('، ')}`:''}</p>
  <div class="tableWrap" style="max-height:320px;overflow:auto"><table><thead><tr><th>الرقم التدريبي</th><th>الاسم</th><th>الشعبة</th></tr></thead><tbody>${good.slice(0,200).map(x=>`<tr><td class="num">${esc(x.id)}</td><td>${esc(x.name)}</td><td>${esc(x.section||'—')}</td></tr>`).join('')}</tbody></table></div>
  <div class="row" style="margin-top:12px"><button class="btn" id="up" ${good.length?'':'disabled'}>رفع ${AR(good.length)} متدربًا</button><span class="msg" id="upm"></span></div></div>`;
  $('#up').onclick=async()=>{const b=$('#up');b.disabled=true;let a=0,u=0;
    for(let i=0;i<good.length;i+=150){$('#upm').innerHTML=`<span class="spin"></span> ${AR(Math.min(i+150,good.length))} / ${AR(good.length)}`;
      const r=await api({a:'tstudents',token:TOKEN,op:'import',rows:good.slice(i,i+150)});if(!r.ok){$('#upm').className='msg bad';$('#upm').textContent=errText(r.error);b.disabled=false;return}a+=r.added;u+=r.updated}
    $('#upm').className='msg good';$('#upm').textContent=`تم: أُضيف ${AR(a)} وحُدِّث ${AR(u)}.`;toast('تم الاستيراد');await load();tab='import'};
}

  $('#e4').onclick=()=>saveBook([['المتدربون',[['الرقم التدريبي','الاسم','الشعبة'],...stu().map(s=>[s.id,s.name,secName(s.sectionId)])],[16,26,16]]],`المتدربون-${tag()}.xlsx`);
